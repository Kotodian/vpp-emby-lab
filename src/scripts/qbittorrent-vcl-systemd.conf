[Unit]
Wants=qbittorrent-webui.socket
After=vpp-f0.service wan-watchdog.service
BindsTo=vpp-f0.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/qbittorrent-vcl-start.sh --webui-port=8080
Restart=no
LimitCORE=infinity
TimeoutStopSec=5min
TimeoutStopFailureMode=abort
TimeoutAbortSec=5min
SendSIGKILL=no
# File cache pressure must not swap out the network thread's buffers or VCL FIFOs.
MemorySwapMax=0
# These filters apply to Linux IP sockets only. VCL's AF_UNIX/shared-memory
# dataplane is unaffected. Permit the existing DNS stub, deny kernel peers.
IPAccounting=yes
IPAddressDeny=any
IPAddressAllow=127.0.0.53/32
StandardOutput=append:/var/log/qbit-vcl/qbittorrent.log
StandardError=append:/var/log/qbit-vcl/qbittorrent.log
