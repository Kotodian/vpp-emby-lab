unix {
  nodaemon
  pidfile /run/vpp-lb/vpp.pid
  cli-listen /run/vpp-lb/cli.sock
  log /var/log/vpp-lb/vpp.log
  runtime-dir /run/vpp-lb
  coredump-size unlimited
  full-coredump
}
api-segment { prefix vpp-lb }
socksvr { socket-name /run/vpp-lb/api.sock }
ethernet { default-mtu 1500 }

cpu { main-core 0 corelist-workers 1 }
memory { main-heap-size 128M main-heap-page-size 2M default-hugepage-size 2M }
buffers { buffers-per-numa 8192 default data-size 2048 page-size 2M layout packed }

dpdk {
  uio-driver vfio-pci
  uio-bind-force
  dev 0000:00:03.0 {
    num-rx-queues 1
    num-rx-desc 512
    num-tx-desc 512
  }
}

plugins {
  plugin dpdk_plugin.so { enable }
  plugin tap_plugin.so { enable }
  plugin lb_plugin.so { enable }
}
